name: Places MAX et déploiement

on:
  push:
    branches: [main, claude/sncf-train-routing-brief-5q8yfc]
  schedule:
    # SNCF publishes the dataset around 05:20 UTC; second run as a safety net.
    - cron: '41 5 * * *'
    - cron: '41 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Download and split the tgvmax dataset
        run: node scripts/build-data.js --out site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
